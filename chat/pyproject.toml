[project]
name = "chestor-chat"
version = "0.1.0"
description = "Live-чат и квиз для chestor.site: aiohttp + selfrotgram"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "aiohttp (>=3.14.3,<4.0.0)",
    "selfrotgram (>=0.1.4,<0.2.0)",
    "redis (>=5)",
    "ghoul-quiz-lib @ git+https://github.com/SelfTopic/questions_ghoul_api_lib.git",
]

[tool.poetry]
package-mode = true
packages = [{ include = "chestor_chat" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF", "SIM"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["chestor_chat", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "ruff (>=0.16.9,<0.17.0)",
    "pyright (>=1.1.414,<2.0.0)",
    "fakeredis (>=2.38.0,<3.0.0)"
]
